packages:
  # packagesディレクトリ配下はすべてを登録
  - "packages/**"
  - web
  - cli
# transitiveな脆弱バージョンを強制的に置き換える
overrides:
  "postcss@<8.5.18": "^8.5.25"
  "sharp@<0.35.4": "^0.35.4"
  # GHSA-2v37-7h3g-55p8 (nanoid: infinite loop with size 0)
  "nanoid@<3.3.17": "^3.3.17"
  # GHSA-5p4m-2wfm-xmqj (js-yaml: quadratic CPU consumption in !!omap)
  # 3.x と 4.x はAPIが非互換なのでメジャーごとに指定する
  # GHSA-2883-xcg3-v3hh (js-yaml: maxTotalMergeKeys does not limit CPU use)
  "js-yaml@<3.15.2": "^3.15.2"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  # GHSA-4cwx-7wf7-3272 (undici: cross-user information disclosure)
  "undici@>=7.0.0 <7.29.0": "^7.29.0"
  # CVE-2026-73088 / CVE-2026-73089 (browserslist)
  "browserslist@<4.28.7": "^4.28.7"
  # CVE-2026-75899 / 75931 / 75975 / 76172 (fast-uri)
  "fast-uri@>=3.0.0 <3.1.6": "^3.1.6"

auditConfig:
  ignoreCves:
    - CVE-2026-4800
    - CVE-2024-21538
    - CVE-2026-26996
    - CVE-2026-27903
    - CVE-2026-27904
    - CVE-2026-33671
    - CVE-2026-4926

# transitive dependencyがgitやtarball URLから解決されることを防止
blockExoticSubdeps: true

# Supply chain security settings
# 公開から24時間未満のバージョンを除外
minimumReleaseAge: 1440

# ビルドスクリプトの実行を許可するパッケージ
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

# provenanceの信頼レベルが低下したパッケージのインストールを拒否
trustPolicy: no-downgrade

# 公開から30日以上経過したバージョンはtrustチェックを免除
# (provenance導入前の古いバージョンがtrust downgrade扱いされるのを防ぐ)
trustPolicyIgnoreAfter: 43200
