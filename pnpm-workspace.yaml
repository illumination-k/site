packages:
  # packagesディレクトリ配下はすべてを登録
  - "packages/**"
  - web
  - cli
# transitiveな脆弱バージョンを強制的に置き換える
overrides:
  "postcss@<8.5.18": "^8.5.25"
  "sharp@<0.35.0": "^0.35.3"

auditConfig:
  ignoreCves:
    - CVE-2026-4800
    - CVE-2024-21538
    - CVE-2026-26996
    - CVE-2026-27903
    - CVE-2026-27904
    - CVE-2026-33671
    - CVE-2026-4926

# transitive dependencyがgitやtarball URLから解決されることを防止
blockExoticSubdeps: true

# Supply chain security settings
# 公開から24時間未満のバージョンを除外
minimumReleaseAge: 1440

# ビルドスクリプトの実行を許可するパッケージ
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

# provenanceの信頼レベルが低下したパッケージのインストールを拒否
trustPolicy: no-downgrade

# 公開から30日以上経過したバージョンはtrustチェックを免除
# (provenance導入前の古いバージョンがtrust downgrade扱いされるのを防ぐ)
trustPolicyIgnoreAfter: 43200
